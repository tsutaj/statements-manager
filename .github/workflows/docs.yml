name: docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Fetch tags and branches
        run: |
          git fetch -t --all
          git branch master origin/master 2>/dev/null || echo "master branch already exists"
          git branch stable origin/stable 2>/dev/null || echo "stable branch already exists"

      - name: Build documentation
        run: sphinx-polyversion --sequential docs/poly.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/_build
          retention-days: 7

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy via rsync
        run: |
          rsync -avz --delete --itemize-changes --dry-run \
            --exclude='.doctrees/' \
            --exclude='_sources/' \
            docs/_build/ \
            ubuntu@${{ secrets.SSH_HOST }}:${{ secrets.SSH_DEPLOY_PATH }}/
